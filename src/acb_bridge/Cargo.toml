[package]
name = "acb_bridge"
version = "0.12.0"
edition = "2021"
license = "Apache-2.0"
description = "ROS 2 bridge between Autoware and CARLA simulator"
repository = "https://github.com/NEWSLabNTU/ros_zenoh_bridge"

[lib]
name = "acb_bridge"
path = "src/lib.rs"

[[bin]]
name = "acb_bridge"
path = "src/main.rs"

# cargo-ament-build metadata for installing additional files
[package.metadata.ros]
install_to_share = ["launch", "config"]

[dependencies]
# ROS 2 dependencies
rclrs = "0.7"

# ROS 2 message packages
# NOTE: These crates are generated during colcon build (stage 1) and made
# available through .cargo/config.toml patches. Use wildcards to allow
# cargo to find them from the generated config.
std_msgs = "*"
builtin_interfaces = "*"
geometry_msgs = "*"
nav_msgs = "*"
sensor_msgs = "*"
tf2_msgs = "*"
autoware_adapi_v1_msgs = "*"
autoware_control_msgs = "*"
autoware_vehicle_msgs = "*"
tier4_vehicle_msgs = "*"
tier4_control_msgs = "*"

# CARLA and utilities
# Using local carla-rust for latest APIs and multi-version support
carla.workspace = true
atomic_float = "1.1.0"
arc-swap = "1.6.0"
interp = "2.1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
nalgebra = "0.34.1"
ndarray = "0.16.1"
urdf-rs = "0.8.0"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9"
thiserror = "2.0.16"
eyre = "0.6"
color-eyre = "0.6"
ctrlc = { version = "3", features = ["termination"] }
bytemuck = { version = "1.21", features = ["derive"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(carla_0916)'] }

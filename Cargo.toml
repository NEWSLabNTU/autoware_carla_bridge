[workspace]
resolver = "2"
members = [
    "src/acb_bridge",
    "src/carla_pcd_gen",
    "src/carla_manual_control",
]

[workspace.dependencies]
carla = "0.14.0"

[patch.crates-io]
# Must stay on the same rev as carla-scenario-bridge: both bridges talk to one CARLA server,
# and building them against different FFI is what produced std::bad_array_new_length before.
carla = { git = "https://github.com/jerry73204/carla-rust.git", rev = "2718365" }

# Custom profile: release with debug info and assertions
# Useful for debugging performance issues while maintaining release optimizations
[profile.dev-release]
inherits = "release"
debug = true
debug-assertions = true

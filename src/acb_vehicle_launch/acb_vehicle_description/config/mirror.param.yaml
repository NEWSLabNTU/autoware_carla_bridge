#
# Mirror Position Parameters (NOT USED WITH CARLA)
#
# These parameters define the range of mirror/camera positions for visualization
# in Autoware's planning_simulator. When using CARLA, camera positions are defined
# in the sensor_kit URDF and handled by CARLA's sensor system.
#
# This file is kept for compatibility but has no effect when running with CARLA.
#

/**:
  ros__parameters:
    min_longitudinal_offset: 1.8
    max_longitudinal_offset: 3.2
    min_lateral_offset: -1.4
    max_lateral_offset: 1.4
    min_height_offset: 0.8
    max_height_offset: 1.5

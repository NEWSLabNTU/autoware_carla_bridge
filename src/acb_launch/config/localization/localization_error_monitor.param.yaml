/**:
  ros__parameters:
    scale: 3.0
    # Relaxed thresholds for CARLA simulation:
    # NDT with 2K downsampled points and 2.0m resolution gives weak Y/yaw constraint,
    # producing EKF error ellipses of ~5-10 initially. These converge over time but
    # take longer than real hardware. Relaxed thresholds allow autonomous mode to
    # engage while EKF continues converging.
    error_ellipse_size: 10.0
    warn_ellipse_size: 5.0
    error_ellipse_size_lateral_direction: 3.0
    warn_ellipse_size_lateral_direction: 1.0

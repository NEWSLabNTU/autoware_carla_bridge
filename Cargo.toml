[workspace]
resolver = "2"
members = [
    "src/acb_bridge",
    "src/carla_pcd_gen",
    "src/carla_manual_control",
]

[workspace.dependencies]
# The feature names the CARLA this workspace talks to; carla-rust refuses to build without
# one (CARLA_VERSION, when set, still overrides it).
carla = { version = "0.14.0", features = ["carla-0916"] }

[patch.crates-io]
# Must stay on the same rev as carla-scenario-bridge: both bridges talk to one CARLA server,
# and building them against different FFI is what produced std::bad_array_new_length before.
# e06de1c selects the CARLA version with a cargo feature (carla-0916 above) instead of the
# CARLA_VERSION env var alone, whose absence silently built the 0.10 API.
carla = { git = "https://github.com/jerry73204/carla-rust.git", rev = "e06de1c" }

# Custom profile: release with debug info and assertions
# Useful for debugging performance issues while maintaining release optimizations
[profile.dev-release]
inherits = "release"
debug = true
debug-assertions = true

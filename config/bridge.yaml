# Autoware-CARLA Bridge Configuration

# Initial vehicle spawn pose (CARLA coordinates: meters, degrees)
# This pose is mandatory - the bridge will spawn the vehicle at this location
spawn_pose:
  position:
    x: 190.77        # meters (CARLA X coordinate)
    y: -130.10       # meters (CARLA Y coordinate)
    z: 0.3           # meters (CARLA Z coordinate, minimum 0.3m to avoid ground collision)

  orientation:
    yaw: 175.81      # degrees (CARLA rotation around Z-axis)
    # Note: Only yaw is used for vehicle spawning
    #       Roll and pitch are set to 0 by CARLA

# Direct localization publishing
# Set to true to publish vehicle pose directly to /localization/kinematic_state
# (bypasses Autoware localization - useful for testing)
# Ground truth is always published to /carla/ground_truth/* for debug/evaluation
publish_direct_localization: false

# Automatic localization initialization
# Set to true to automatically call /api/localization/initialize service
# after Autoware is detected. Uses spawn_pose as the initial pose for NDT.
auto_initialize_localization: true

[workspace]
resolver = "2"
members = [
    "src/acb_bridge",
    "src/carla_pcd_gen",
    "src/carla_manual_control",
]
# The components under deps/ (roadmap 051) keep workspaces of their own: their crates are
# path dependencies, built here, never members.
exclude = ["deps"]

[workspace.dependencies]
# The feature names the CARLA this workspace talks to; carla-rust refuses to build without
# one (CARLA_VERSION, when set, still overrides it). Must stay on the same release as
# carla-scenario-bridge: both bridges talk to one CARLA server, and building them against
# different FFI is what produced std::bad_array_new_length before. 0.15.1: the
# carla-rust/0.9.16-4 prebuilt, with upstream CARLA e7e076f backported (the synchronous
# Traffic Manager runs Step() inline; no lost-wakeup World::tick hang).
#
# Roadmap 083: the CARLA version is each package's feature (`carla-0916`, the default, or
# `carla-10`), as in scensim_carla_world, so one workspace builds a 0.9.16 binary or a 1.0
# one (`--no-default-features --features carla-10`). carla-10 is not on crates.io yet:
# carla-rust master 1212b60 (0.15.1 + CARLA 1.0, its prebuilt carla-rust/1.0-1) until a
# release, then the version here.
carla = { git = "https://github.com/jerry73204/carla-rust", rev = "1212b60" }

# Custom profile: release with debug info and assertions
# Useful for debugging performance issues while maintaining release optimizations
[profile.dev-release]
inherits = "release"
debug = true
debug-assertions = true

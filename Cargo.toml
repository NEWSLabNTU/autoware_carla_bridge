[workspace]
resolver = "2"
members = [
    "src/acb_bridge",
    "src/carla_pcd_gen",
    "src/carla_manual_control",
]

[workspace.dependencies]
# The feature names the CARLA this workspace talks to; carla-rust refuses to build without
# one (CARLA_VERSION, when set, still overrides it). Must stay on the same release as
# carla-scenario-bridge: both bridges talk to one CARLA server, and building them against
# different FFI is what produced std::bad_array_new_length before. 0.15.1: the
# carla-rust/0.9.16-4 prebuilt, with upstream CARLA e7e076f backported (the synchronous
# Traffic Manager runs Step() inline; no lost-wakeup World::tick hang).
carla = { version = "0.15.1", features = ["carla-0916"] }

# Custom profile: release with debug info and assertions
# Useful for debugging performance issues while maintaining release optimizations
[profile.dev-release]
inherits = "release"
debug = true
debug-assertions = true

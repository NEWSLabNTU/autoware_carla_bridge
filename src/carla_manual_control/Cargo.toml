[package]
name = "carla_manual_control"
version = "0.1.0"
edition = "2021"
description = "CARLA Manual Control - Interactive vehicle control with multiple sensors and HUD"
license = "Apache-2.0"

[features]
# The CARLA this binary talks to: exactly one (carla-rust refuses none or two). 0.9.16 is the
# default; `--no-default-features --features carla-10` builds for CARLA 1.0 (roadmap 083).
default = ["carla-0916"]
carla-0916 = ["carla/carla-0916"]
carla-10 = ["carla/carla-10"]

[dependencies]
# CARLA client (using local carla-rust for try_connect/try_world APIs)
carla.workspace = true

# Graphics and UI
macroquad = "0.4"

# Error handling
eyre = "0.6"
color-eyre = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = "0.25.9"
nalgebra = "0.34.1"

[package.metadata.ros]
# No special ROS metadata needed for this binary

# CARLA Simulator MRM Handler Configuration
# Relaxed timeouts for simulation environment where timing is less predictable
# than real-time systems due to CARLA synchronization and variable frame rates
---
/**:
  ros__parameters:
    update_rate: 10
    # Large timeout for operation mode availability (default: 0.5s)
    # CARLA simulation has variable frame rates and diagnostic timing.
    # A short timeout causes MRM oscillation (NORMAL↔MRM_OPERATING),
    # which triggers emergency_stop and zeros the vehicle speed.
    timeout_operation_mode_availability: 30.0
    # Large timeouts for MRM behavior calls (default: 0.01s)
    timeout_call_mrm_behavior: 5.0
    timeout_cancel_mrm_behavior: 5.0
    use_emergency_holding: false
    timeout_emergency_recovery: 5.0
    use_parking_after_stopped: false
    # Disabled for simulation - no pull over or comfortable stop behaviors
    use_pull_over: false
    use_comfortable_stop: false

    # setting whether to turn hazard lamp on for each situation
    turning_hazard_on:
      emergency: true

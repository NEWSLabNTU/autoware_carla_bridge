# CARLA Sensor Configuration
#
# This file provides CARLA-specific sensor parameters that cannot be obtained
# from Autoware's URDF/TF configuration. The bridge uses URDF as the primary
# source for sensor types and positions, and this config fills the gaps.
#
# Structure:
#   - defaults: Type-level default parameters
#   - sensors: Sensor-specific overrides (keyed by link name from URDF)

# Type-level defaults for each sensor category
defaults:
  # Camera sensors (sensor.camera.rgb, sensor.camera.depth, etc.)
  camera:
    image_size_x: 800
    image_size_y: 600
    fov: 90.0              # Field of view in degrees
    sensor_tick: 0.0       # 0.0 = as fast as possible
    gamma: 2.2
    shutter_speed: 60.0
    iso: 1200.0
    fstop: 1.4
    enable_postprocess_effects: true

  # LiDAR sensors (sensor.lidar.ray_cast)
  lidar:
    channels: 32           # Number of laser channels
    range: 100.0           # Maximum range in meters
    points_per_second: 500000
    rotation_frequency: 10.0  # Hz
    upper_fov: 10.0        # Upper field of view in degrees
    lower_fov: -30.0       # Lower field of view in degrees
    atmosphere_attenuation_rate: 0.004
    dropoff_general_rate: 0.45
    dropoff_intensity_limit: 0.8
    dropoff_zero_intensity: 0.4
    sensor_tick: 0.0

  # GNSS sensors (sensor.other.gnss)
  gnss:
    noise_alt_bias: 0.0
    noise_alt_stddev: 0.0
    noise_lat_bias: 0.0
    noise_lat_stddev: 0.0
    noise_lon_bias: 0.0
    noise_lon_stddev: 0.0
    sensor_tick: 0.0

  # IMU sensors (sensor.other.imu)
  imu:
    noise_accel_stddev_x: 0.0
    noise_accel_stddev_y: 0.0
    noise_accel_stddev_z: 0.0
    noise_gyro_stddev_x: 0.0
    noise_gyro_stddev_y: 0.0
    noise_gyro_stddev_z: 0.0
    noise_gyro_bias_x: 0.0
    noise_gyro_bias_y: 0.0
    noise_gyro_bias_z: 0.0
    sensor_tick: 0.0

  # Radar sensors (sensor.other.radar)
  radar:
    horizontal_fov: 30.0   # Degrees
    vertical_fov: 30.0     # Degrees
    points_per_second: 1500
    range: 100.0           # Meters
    sensor_tick: 0.0

# Sensor-specific overrides
# Key: link name from URDF (matches frame_id in TF)
# Value: CARLA-specific parameters (merged with type defaults)
sensors:
  # Example: Override camera parameters for traffic light camera
  traffic_light_left_camera_link:
    fov: 50.0              # Narrower FOV for traffic light detection
    image_size_x: 1280
    image_size_y: 720

  traffic_light_right_camera_link:
    fov: 50.0
    image_size_x: 1280
    image_size_y: 720

  # Example: High-resolution camera for front perception
  camera_link:
    image_size_x: 1920
    image_size_y: 1200
    fov: 100.0

  # Example: High-density LiDAR for main perception
  velodyne_top_base_link:
    channels: 64           # Higher channel count
    points_per_second: 1000000
    rotation_frequency: 20.0
    upper_fov: 15.0
    lower_fov: -25.0

  # Example: Lower-density LiDAR for rear coverage
  velodyne_rear_base_link:
    channels: 16
    points_per_second: 300000
    rotation_frequency: 10.0

  # Example: IMU with realistic noise characteristics
  imu_link:
    noise_accel_stddev_x: 0.01
    noise_accel_stddev_y: 0.01
    noise_accel_stddev_z: 0.01
    noise_gyro_stddev_x: 0.001
    noise_gyro_stddev_y: 0.001
    noise_gyro_stddev_z: 0.001

  # Example: GNSS with realistic noise
  gnss_link:
    noise_alt_stddev: 0.1
    noise_lat_stddev: 0.00001
    noise_lon_stddev: 0.00001

# Notes:
# - If a sensor link is not listed here, type defaults are used
# - Unknown parameters are ignored
# - URDF position/orientation always takes precedence
# - Sensor type is inferred from URDF sensor plugin or frame name patterns

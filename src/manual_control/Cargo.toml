[package]
name = "manual_control"
version = "0.1.0"
edition = "2021"
description = "CARLA Manual Control - Interactive vehicle control with multiple sensors and HUD"
license = "Apache-2.0"

[dependencies]
# CARLA client (using local carla-rust for try_connect/try_world APIs)
carla.workspace = true

# Graphics and UI
macroquad = "0.4"

# Error handling
eyre = "0.6"
color-eyre = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = "0.25.9"
nalgebra = "0.34.1"

[package.metadata.ros]
# No special ROS metadata needed for this binary
